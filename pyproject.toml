[project]
name = "moex_ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "numpy>=2.0.0,<3.0.0",
    "matplotlib>=3.9.0,<6.0.0",
    "seaborn>=0.13.2",
    "ipykernel>=7.4.0",
    "statsmodels>=0.15.0",
    "scipy>=1.18.1",
    "kagglehub>=1.0.3",
    "ipywidgets>=8.1.9",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
data = [
    "requests>=2.34.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff.lint]
select = [
"E", "F", "I", "UP", "B", "SIM"
]

[tool.mypy]
strict=true

[tool.pytest.ini_options]
testpaths = ["tests"]
